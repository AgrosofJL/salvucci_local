name: Compilar Salvucci para Mac

on:
  push:
    branches:
      - main
      - master # Cambialo si tu rama principal tiene otro nombre
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build-mac:
    runs-on: macos-latest # Le dice a GitHub que use una Mac virtual

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Versión estable recomendada para Electron

      - name: Instalar Dependencias
        run: npm install

      - name: Compilar para macOS (DMG)
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir Instalador DMG
        uses: actions/upload-artifact@v3
        with:
          name: Salvucci-Mac-Instalador
          path: dist/*.dmg